name: Semgrep
on:
  push:
    branches: [main]
  pull_request:
jobs:
  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config .semgrep/my-rule.yaml --config p/python --config p/owasp-top-10 --error